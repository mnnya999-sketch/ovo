0 40px}.progress div{height:100%;background:#6e8663;transition:width .25s}h2{font:30px/1.6 SimSun,serif;font-weight:400;margin:10px 0 27px}.option{display:flex;align-items:center;gap:17px;width:100%;text-align:left;border:1px solid var(--line);background:#fffdf8;border-radius:6px;padding:19px;margin-bottom:13px;font-size:13px;line-height:1.7;color:var(--ink)}.option:hover,.option.selected{background:#e8eede;border-color:#8c9b7d}.letter{width:29px;height:29px;flex-shrink:0;border:1px solid #d5dac9;border-radius:50%;display:grid;place-items:center;font:12px Georgia;color:#8c987d}.quiznav{display:flex;align-items:center;justify-content:space-between;margin-top:25px}.plain{background:transparent;border:0;color:#858d7b;padding:10px;font-size:12px}.plain:disabled{opacity:.4;cursor:default}.hint{font-size:10px;color:var(--muted)}.result{max-width:750px;margin:auto}.result-head{text-align:center;background:#e9eedf;border:1px solid #d9decb;border-radius:100px 100px 8px 8px;padding:38px 25px}.result-head .icon{font:60px Georgia;color:#8b9e79;margin:16px}.result-head h1{font-size:42px;margin:10px}.result-head .tag{font-size:13px;color:#6e8062;letter-spacing:3px}.result-head p{font-size:12px;color:#7f8976;line-height:1.8}.panel{padding:25px 0;border-bottom:1px solid var(--line)}.panel h3{font-size:14px;font-weight:500}.panel p{font-size:13px;line-height:2;color:#7c8373}.traits{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:25px 0}.trait span{font-size:11px;color:#79836e;display:flex;justify-content:space-between}.bar{height:6px;background:#e6e7db;border-radius:4px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#8d9d79}.actions{display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin:25px 0}.secondary{background:transparent;border:1px solid var(--line);border-radius:5px;padding:15px 20px;font-size:12px;color:var(--green)}footer{text-align:center;padding:25px;color:#9b9d91;font-size:9px;letter-spacing:2px}#message{font-size:12px;color:var(--green);line-height:1.8}textarea{width:100%;height:180px;font:13px/1.8 sans-serif;padding:12px;border:1px solid var(--line);background:white}.fade{animation:appear .3s}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media(max-width:650px){header{padding:23px 22px}header span{font-size:8px;letter-spacing:1px}main{padding:35px 22px}.intro{grid-template-columns:1fr;gap:35px}h1{font-size:40px}.art{height:240px;max-width:310px;width:100%;margin:auto}.bigstar{font-size:105px}.art .label{bottom:30px}.smallstar{top:55px}h2{font-size:25px}.option{font-size:12px;padding:15px}.hint{max-width:160px;text-align:right;line-height:1.7}.traits{gap:18px}.result-head{padding:32px 18px}.result-head h1{font-size:36px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html{ -webkit-text-size-adjust:100%; }body{min-height:100svh;padding-bottom:env(safe-area-inset-bottom)}button{touch-action:manipulation;min-height:48px;-webkit-tap-highlight-color:transparent}textarea{font-size:16px}header{padding-top:max(23px,env(safe-area-inset-top))}h2:focus{outline:none}.option:active{background:#dce6cf}.resume{display:block;margin-top:15px}.progressmeta{position:relative}

</style></head><body><header><b>✳ 灵感同频</b><span>FIND YOUR KINDRED SPIRIT</span></header><main id="app"></main><footer>A LITTLE DISCOVERY ABOUT YOU ✦</footer><script>
const questions=[
['周末突然空出一整天，你最想怎么过？',['随心逛逛，把新鲜的灵感记下来','拆解一个有趣的问题，研究到明白','约朋友聊聊，也听听他们最近的故事','定一个小目标，今天就把它完成']],
['面对一个全新的项目，你通常先做什么？',['想象它可以呈现出多特别的样子','弄清楚它的原理、限制和关键问题','了解大家的想法，找到合作的默契','列出步骤和时间表，立刻开始推进']],
['朋友情绪低落，向你倾诉时，你更自然的反应是？',['用故事或别样的视角，让对方看到新的可能','陪对方梳理事情，寻找问题的原因','先认真听着，让对方感到被理解','问问有什么具体的事，是你现在能帮忙做的']],
['哪一种夸奖最让你开心？',['“你的想法真的很有个人风格。”','“你总能把复杂的事想得很透。”','“跟你相处，会感到很温暖。”','“交给你的事，总让人特别放心。”']],
['计划遇到阻碍时，你更可能怎么做？',['换个玩法，也许会出现更好的创意','回头检查假设，找出真正的症结','找伙伴聊聊，获得支持和不同意见','调整方案，把能做的部分先做起来']],
['如果可以体验一份陌生的工作，你会选？',['创作一部电影，或策划一场展览','参与一项探索未知的研究','经营一个让人们互相支持的空间','带领团队，把一项挑战从零落地']],
['在团队里，你最常扮演哪种角色？',['提供新点子，帮大家打开思路','分析方案，提醒大家注意细节','连接不同的人，照顾团队的氛围','推动进度，让讨论变成实际成果']],
['你更希望自己留下怎样的影响？',['让世界多一点想象力和美','让一个问题被理解得更深入','让身边的人感到被看见、被支持','让一件有意义的事真正发生']]
];
// 四维度为本测试自定义的娱乐标签；不对应名人的真实人格评估。
const profiles=[
{name:'周杰伦',tag:'用自己的节奏，创造新可能',icon:'♫',v:[.65,.05,.2,.1],desc:'你的回答更偏向创意表达，也带着一点对人与感受的关注。你喜欢独特的视角，不太愿意只重复现成的答案。',link:'本测试借用音乐创作者周杰伦的公众创作形象，代表「创意表达」这一侧面。',strength:'你擅长把日常的感受变成新点子。给灵感一个出口，它就更有机会成为真正的作品。',tip:'挑一个你最喜欢的想法，做出一个可以分享的小版本。'},
{name:'阿尔伯特·爱因斯坦',tag:'对世界，始终保留一个问号',icon:'∞',v:[.2,.65,.05,.1],desc:'你的回答更偏向分析与好奇。比起快速接受一个结论，你更想弄明白它为什么成立，也愿意从不同角度推敲。',link:'本测试借用科学家爱因斯坦的公众形象，代表「探索与求知」这一侧面。',strength:'你能在纷杂的信息里寻找逻辑。认真提出的问题，往往就是你最有价值的起点。',tip:'给一个正在思考的问题设定探索期限，然后尝试一次小验证。'},
{name:'奥黛丽·赫本',tag:'把温柔，变成连接的力量',icon:'❀',v:[.1,.05,.65,.2],desc:'你的回答更偏向共情与连接。你会留意别人的感受，也在意一件事是否能让人与人之间多一点理解。',link:'本测试借用演员及人道主义工作者赫本的公众形象，代表「关怀与连接」这一侧面。',strength:'你能让交流变得有温度，也愿意给他人表达的空间。这份细腻是关系中的珍贵资源。',tip:'在照顾别人之前，也用一句清晰的话表达自己的需要。'},
{name:'苏炳添',tag:'每一小步，都向目标靠近',icon:'➶',v:[.05,.15,.1,.7],desc:'你的回答更偏向执行与坚持。面对目标，你愿意拆解步骤、投入练习，也看重看得见的进展。',link:'本测试借用短跑运动员苏炳添的公众形象，代表「行动与坚持」这一侧面。',strength:'你能让想法落地，并在重复的行动中积累成果。稳定推进，是你给自己最可靠的支持。',tip:'为接下来的一周设一个可完成的小目标，同时留出恢复精力的时间。'},
{name:'莱昂纳多·达·芬奇',tag:'让想象力，与好奇心同行',icon:'✧',v:[.43,.43,.04,.1],desc:'你的回答里，创意与分析常常并肩出现。你既喜欢想象新的可能，也享受理解它如何运作。',link:'本测试借用艺术家与博学者达·芬奇的公众形象，代表「创作与探索的结合」。',strength:'你能在不同领域之间寻找联系。把看似无关的想法放在一起，常常会出现值得尝试的新方向。',tip:'选一个跨领域的小点子，先完成草图或原型，再逐步完善。'},
{name:'宫崎骏',tag:'在想象的世界里，安放真实的感受',icon:'☁',v:[.43,.04,.43,.1],desc:'你的回答中，创作与共情相互呼应。你不只在意一个想法是否新颖，也在意它会怎样触动人。',link:'本测试借用动画导演宫崎骏的公众创作形象，代表「想象与情感的结合」。',strength:'你能把细小的观察变成有温度的表达。你关心的日常片段，也可能成为别人产生共鸣的入口。',tip:'记录一个让你有所触动的场景，用文字、画面或声音把它表达出来。'},
{name:'玛丽·居里',tag:'让求知，走进日复一日的行动',icon:'⚛',v:[.04,.43,.1,.43],desc:'你的回答中，分析与执行同样突出。你愿意认真研究，也愿意把思考落实为持续的尝试。',link:'本测试借用科学家居里的公众形象，代表「求知与坚持的结合」。',strength:'你能在耐心观察与动手实践之间往返。对你而言，理解一件事和完成一件事可以互相促进。',tip:'把一个大问题拆成三个可验证的小问题，先完成其中最简单的一个。'},
{name:'姚明',tag:'既能向前走，也能把大家聚在一起',icon:'◎',v:[.04,.1,.43,.43],desc:'你的回答中，连接与执行互相支撑。你既关注团队里的感受，也希望大家能一起走向具体的目标。',link:'本测试借用篮球运动员姚明的公众形象，代表「协作与行动的结合」。',strength:'你善于把关心变成实际支持。让不同的人找到参与的位置，是你推动事情的一种方式。',tip:'为一件正在合作的事明确分工，也主动问问每个人需要什么支持。'}
];
const app=document.querySelector('#app');let answers=[],index=0,lastResult=null;
const storageKey='kindred-mobile-v1';
function saveProgress(done=false){try{localStorage.setItem(storageKey,JSON.stringify({answers,index,done}))}catch{}}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(storageKey));if(x&&Array.isArray(x.answers)&&x.answers.length<=8&&x.answers.every(n=>Number.isInteger(n)&&n>=0&&n<4)&&Number.isInteger(x.index)&&x.index>=0&&x.index<8&&(!x.done||x.answers.length===8))return x}catch{}return null}

function home(){const saved=loadProgress();app.innerHTML=`<section class="intro fade"><div><div class="eyebrow">A LITTLE SELF-DISCOVERY</div><h1>世界上的另一个你，<br>像哪位<em>名人</em>？</h1><p class="desc">从你的日常选择里，寻找熟悉的气质。<br>也许是创作者的灵感，也许是探索者的好奇心。</p><button class="primary" id="start">发现我的同频名人 <span>↗</span></button>${saved?'<button class="secondary resume" id="resume">继续上次的测试 →</button>':''}<p class="meta">8 道小问题 · 约 2 分钟 · 无需登录</p></div><div class="art" aria-hidden="true"><span class="bigstar">✳</span><span class="smallstar">✧</span><span class="label">UNIQUE IN YOUR OWN WAY</span></div></section><div class="bottomnote">这是一份基于自定义规则的趣味测试，比较的是回答所呈现的气质与名人的公众形象，不是外貌识别或科学人格测评。答案只在本机处理，不会上传。支持手机竖屏，进度自动保存在当前浏览器。</div>`;document.querySelector('#start').onclick=()=>{answers=[];index=0;saveProgress();quiz()};if(saved)document.querySelector('#resume').onclick=()=>{answers=saved.answers;index=saved.index;if(saved.done)result();else quiz()}}
function quiz(){saveProgress();const q=questions[index];app.innerHTML=`<section class="quiz fade"><div class="progressmeta"><span>认识你的第 ${index+1} 步</span><span>${index+1} / ${questions.length}</span></div><div class="progress"><div style="width:${index/questions.length*100}%"></div></div><div class="eyebrow">TRUST YOUR FIRST INSTINCT</div><h2 tabindex="-1">${q[0]}</h2>${q[1].map((x,i)=>`<button class="option ${answers[index]===i?'selected':''}" data-option="${i}" aria-pressed="${answers[index]===i}"><span class="letter">${'ABCD'[i]}</span><span>${x}</span></button>`).join('')}<div class="quiznav"><button class="plain" id="back" ${index===0?'disabled':''}>← 上一题</button><span class="hint">选最接近你的答案，没有标准对错。</span></div></section>`;app.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{answers[index]=+b.dataset.option;if(index<questions.length-1){index++;quiz()}else result()});document.querySelector('#back').onclick=()=>{index--;quiz()};app.querySelector('h2').focus();window.scrollTo(0,0)}
function calculate(a){const totals=[0,0,0,0];a.forEach(i=>totals[i]++);const v=totals.map(x=>x/questions.length);const ranked=profiles.map((p,i)=>({i,d:p.v.reduce((s,x,j)=>s+(x-v[j])**2,0)})).sort((a,b)=>a.d-b.d||a.i-b.i);return {totals,v,p:profiles[ranked[0].i],close:ranked.slice(1,3).map(x=>profiles[x.i].name),balanced:Math.max(...totals)-Math.min(...totals)<=1}}
function result(){saveProgress(true);lastResult=calculate(answers);const {totals,p,close,balanced}=lastResult;app.innerHTML=`<section class="result fade"><div class="result-head"><div class="eyebrow">YOUR KINDRED SPIRIT</div><div class="icon">${p.icon}</div><span class="meta">这一次，你更接近的名人气质是</span><h1>${p.name}</h1><div class="tag">${p.tag}</div><p>相似的是某种气质，而你仍然是独一无二的自己。</p></div><div class="panel"><h3>✦ 从你的选择看见你</h3><p>${balanced?'你的四种倾向分布较均衡，没有明显的单一主导维度；本次结果只是多个接近候选中的一个。 ':''}${p.desc}</p><p>${p.link}这不是对名人真实人格的判断，也不意味着你具有相同的能力或成就。</p></div><div class="panel"><h3>你的回答分布</h3><div class="traits">${['创意表达','分析探索','共情连接','执行推进'].map((x,i)=>`<div class="trait"><span>${x}<b>${totals[i]} / 8</b></span><div class="bar"><i style="width:${totals[i]/8*100}%"></i></div></div>`).join('')}</div><p>每个答案对应一个维度，累计后与 8 个预设气质组合比较，选择距离最近的结果。同距时按固定顺序展示。这里的数字是选项计数，不是能力得分或真实相似度。</p></div><div class="panel"><h3>你可以珍惜的力量</h3><p>${p.strength}</p><h3>给你的一个小提议</h3><p>${p.tip}</p><p>另外两个接近的候选：${close.join('、')}。</p></div><div class="actions"><button class="primary" id="copy">复制我的结果 ↗</button><button class="secondary" id="again">重新测试</button><button class="plain" id="review">回看我的答案</button></div><div id="message" role="status"></div><div class="bottomnote">仅供娱乐与自我探索。进度仅保存在当前浏览器，可从首页继续；隐私模式或浏览器限制可能使保存不可用。无需联网，答案不会上传。</div></section>`;document.querySelector('#again').onclick=home;document.querySelector('#review').onclick=()=>{index=0;quiz()};document.querySelector('#copy').onclick=async()=>{const text=`我在「灵感同频」测试中的名人气质是：${p.name}。\n${p.tag}\n${p.desc}\n（趣味规则测试，非科学人格评估）`;try{await navigator.clipboard.writeText(text);document.querySelector('#message').textContent='已复制，可以分享给朋友。'}catch{document.querySelector('#message').textContent='请手动复制下方结果：';const ta=document.createElement('textarea');ta.value=text;ta.readOnly=true;document.querySelector('#message').append(ta);ta.select()}};window.scrollTo(0,0)}home();
</script></body></html>
