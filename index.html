const app=document.querySelector('#app');let answers=[],index=0,lastResult=null;
const storageKey='kindred-mobile-v2-24';
function saveProgress(done=false){try{localStorage.setItem(storageKey,JSON.stringify({answers,index,done}))}catch{}}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(storageKey));if(x&&Array.isArray(x.answers)&&x.answers.length<=questions.length&&x.answers.every(n=>Number.isInteger(n)&&n>=0&&n<4)&&Number.isInteger(x.index)&&x.index>=0&&x.index<questions.length&&x.index<=x.answers.length&&(!x.done||x.answers.length===questions.length))return x}catch{}return null}

function home(){const saved=loadProgress();app.innerHTML=`<section class="intro fade"><div><div class="eyebrow">A LITTLE SELF-DISCOVERY</div><h1>世界上的另一个你，<br>像哪位<em>名人</em>？</h1><p class="desc">从你的日常选择里，寻找熟悉的气质。<br>也许是创作者的灵感，也许是探索者的好奇心。</p><button class="primary" id="start">发现我的同频名人 <span>↗</span></button>${saved&&saved.answers.length?'<button class="secondary resume" id="resume">'+(saved.done?'查看上次的结果':'继续上次的测试 · 已答 '+saved.answers.length+' / '+questions.length)+' →</button><button class="plain" id="clear">清除本机进度</button>':''}<p class="meta">24 道情境题 · 约 4–6 分钟 · 无需登录</p></div><div class="art" aria-hidden="true"><span class="bigstar">✳</span><span class="smallstar">✧</span><span class="label">UNIQUE IN YOUR OWN WAY</span></div></section><div class="bottomnote">这是一份基于自定义规则的趣味测试，比较的是回答所呈现的气质与名人的公众形象，不是外貌识别或科学人格测评。答案只在本机处理，不会上传。支持手机竖屏，进度自动保存在当前浏览器。</div>`;document.querySelector('#start').onclick=()=>{answers=[];index=0;saveProgress();quiz()};if(saved&&saved.answers.length){document.querySelector('#clear').onclick=()=>{try{localStorage.removeItem(storageKey)}catch{}home()};document.querySelector('#resume').onclick=()=>{answers=saved.answers;index=saved.index;if(saved.done)result();else quiz()}}}
function quiz(){saveProgress();const q=questions[index];const chapter=['日常与好奇','相处与选择','成长与行动'][Math.floor(index/8)];app.innerHTML=`<section class="quiz fade"><div class="progressmeta"><span>${chapter} · 第 ${Math.floor(index/8)+1} 章</span><span>${index+1} / ${questions.length}</span></div><div class="progress" role="progressbar" aria-label="答题进度" aria-valuenow="${index+1}" aria-valuemin="0" aria-valuemax="${questions.length}"><div style="width:${(index+1)/questions.length*100}%"></div></div><div class="eyebrow">TRUST YOUR FIRST INSTINCT</div><h2 tabindex="-1">${q[0]}</h2>${[0,1,2,3].map((display)=>{const i=(display+index)%4;return `<button class="option ${answers[index]===i?'selected':''}" data-option="${i}" aria-pressed="${answers[index]===i}"><span class="letter">${'ABCD'[display]}</span><span>${q[1][i]}</span><span class="check" aria-hidden="true">${answers[index]===i?'✓':''}</span></button>`}).join('')}<div class="quiznav"><button class="plain" id="back" ${index===0?'disabled':''}>← 上一题</button><button class="plain" id="pause">稍后继续</button><button class="primary next" id="next" ${answers[index]===undefined?'disabled':''}>${index===questions.length-1?'查看结果 ✦':'下一题 →'}</button></div><p class="answer-note" role="status">${answers[index]===undefined?'选择最接近你的答案，再点下一题。':'已选好，可以修改，也可以继续。'}</p></section>`;app.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{answers[index]=+b.dataset.option;saveProgress();app.querySelectorAll('[data-option]').forEach(x=>{const chosen=+x.dataset.option===answers[index];x.classList.toggle('selected',chosen);x.setAttribute('aria-pressed',String(chosen));x.querySelector('.check').textContent=chosen?'✓':''});document.querySelector('#next').disabled=false;document.querySelector('.answer-note').textContent='已选好，可以修改，也可以继续。'});document.querySelector('#next').onclick=()=>{if(answers[index]===undefined)return;if(index<questions.length-1){index++;quiz()}else result()};document.querySelector('#back').onclick=()=>{index--;quiz()};document.querySelector('#pause').onclick=home;app.querySelector('h2').focus({preventScroll:true});window.scrollTo(0,0)}
function calculate(a){const totals=[0,0,0,0];a.forEach(i=>totals[i]++);const v=totals.map(x=>x/questions.length);const ranked=profiles.map((p,i)=>({i,d:p.v.reduce((s,x,j)=>s+(x-v[j])**2,0)})).sort((a,b)=>a.d-b.d||a.i-b.i);return {totals,v,p:profiles[ranked[0].i],close:ranked.slice(1,3).map(x=>profiles[x.i].name),balanced:Math.max(...totals)-Math.min(...totals)<=1}}
function result(){saveProgress(true);lastResult=calculate(answers);const {totals,p,close,balanced}=lastResult;app.innerHTML=`<section class="result fade"><div class="result-head"><div class="eyebrow">YOUR KINDRED SPIRIT</div><div class="icon">${p.icon}</div><span class="meta">这一次，你更接近的名人气质是</span><h1>${p.name}</h1><div class="tag">${p.tag}</div><p>相似的是某种气质，而你仍然是独一无二的自己。</p></div><div class="panel"><h3>✦ 从你的选择看见你</h3><p>${p.desc}</p><p>${p.link}这不是对名人真实人格的判断，也不意味着你具有相同的能力或成就。</p></div><div class="panel"><h3>你的回答分布</h3><div class="traits">${['创意表达','分析探索','共情连接','执行推进'].map((x,i)=>`<div class="trait"><span>${x}<b>${totals[i]} / ${questions.length}</b></span><div class="bar"><i style="width:${totals[i]/questions.length*100}%"></i></div></div>`).join('')}</div><p>每个答案对应一个维度，累计后与 ${profiles.length} 个预设气质组合比较，选择距离最近的结果。同距时按固定顺序展示。这里的数字是选项计数，不是能力得分或真实相似度。</p></div><div class="panel"><h3>你可以珍惜的力量</h3><p>${p.strength}</p><h3>给你的一个小提议</h3><p>${p.tip}</p><p>你还带着这些气质：${close.join('、')}。</p></div><div class="actions"><button class="primary" id="copy">复制我的结果 ↗</button><button class="secondary" id="again">重新测试</button><button class="plain" id="review">回看我的答案</button></div><div id="message" role="status"></div><div class="bottomnote">仅供娱乐与自我探索。进度仅保存在当前浏览器，可从首页继续；隐私模式或浏览器限制可能使保存不可用。无需联网，答案不会上传。</div></section>`;document.querySelector('#again').onclick=home;document.querySelector('#review').onclick=()=>{index=0;quiz()};document.querySelector('#copy').onclick=async()=>{const text=`我在「灵感同频」测试中的名人气质是：${p.name}。\n${p.tag}\n${p.desc}\n（趣味规则测试，非科学人格评估）`;try{await navigator.clipboard.writeText(text);document.querySelector('#message').textContent='已复制，可以分享给朋友。'}catch{document.querySelector('#message').textContent='请手动复制下方结果：';const ta=document.createElement('textarea');ta.value=text;ta.readOnly=true;document.querySelector('#message').append(ta);ta.select()}};window.scrollTo(0,0)}home();
</script></body></html>
